[workspace]
members = [
  "crates/envault",
  "crates/envault-broker",
  "crates/envault-core",
  "crates/envault-crypto",
  "crates/envault-platform",
  "crates/envault-policy",
  "crates/envault-protocol",
  "crates/envault-store",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Thanhbinh1905/envault"
homepage = "https://github.com/Thanhbinh1905/envault"
authors = ["Thanhbinh1905"]

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1.8"
chacha20poly1305 = "0.11"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
