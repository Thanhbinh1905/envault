name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask contract
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - run: cargo deny check
      - run: cargo audit
      - run: cargo xtask package-verify

  build-platform:
    name: Build (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  windows-compile:
    name: Windows compile check
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - run: cargo check --workspace --all-targets

  windows-runtime:
    name: Windows runtime tests
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: [quality, build-platform, windows-compile, windows-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "envault") | .version')
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag_version" || {
            echo "tag $GITHUB_REF_NAME does not match envault version $version" >&2
            exit 1
          }

      - name: Build release binaries
        run: cargo build --locked --release -p envault --bins --target ${{ matrix.target }}

      - name: Generate shell completions
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p completions
          cargo run --locked --release -p envault --features internal-completions --target ${{ matrix.target }} --bin envault -- completions bash >completions/envault.bash
          cargo run --locked --release -p envault --features internal-completions --target ${{ matrix.target }} --bin envault -- completions zsh >completions/_envault
          cargo run --locked --release -p envault --features internal-completions --target ${{ matrix.target }} --bin envault -- completions fish >completions/envault.fish

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="envault-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/completions"
          cp "target/${{ matrix.target }}/release/envault" \
            "target/${{ matrix.target }}/release/envaultd" \
            "target/${{ matrix.target }}/release/envaultui" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE docs/INSTALLATION.md install.sh "$name/"
          cp completions/envault.bash completions/_envault completions/envault.fish "$name/completions/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "envault-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\envault.exe", "target\${{ matrix.target }}\release\envaultd.exe", "target\${{ matrix.target }}\release\envaultui.exe" $name
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, docs\INSTALLATION.md, install.sh $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: |
            envault-v*.tar.gz
            envault-v*.zip
            envault-v*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums manifest
        working-directory: dist
        run: cat *.sha256 | sort -k2 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "EnVault $GITHUB_REF_NAME" --generate-notes --verify-tag
