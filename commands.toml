schema_version = 1

[[command]]
path = "init"
auth = "bootstrap"
daemon = "forbidden"
agent = false
outputs = ["human", "json", "toon"]
errors = ["vault_already_initialized", "invalid_input", "io_error"]

[[command]]
path = "status"
auth = "bootstrap"
daemon = "optional"
agent = true
outputs = ["human", "json", "toon"]
errors = ["io_error"]

[[command]]
path = "start"
auth = "human"
daemon = "spawns"
agent = false
outputs = ["human", "json", "toon"]
errors = ["vault_not_initialized", "authentication_failed", "invalid_startup_profile"]

[[command]]
path = "lock"
auth = "service"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked"]

[[command]]
path = "stop"
auth = "service"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["envault_not_running"]

[[command]]
path = "context"
auth = "agent"
daemon = "required"
agent = true
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked", "permission_denied"]

[[command]]
path = "admin unlock"
auth = "human"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked", "authentication_failed", "invalid_ttl"]

[[command]]
path = "admin status"
auth = "service"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked"]

[[command]]
path = "admin lock"
auth = "admin"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked", "admin_auth_required"]

[[command]]
path = "profile"
auth = "service"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked", "admin_auth_required"]

[[command]]
path = "secret"
auth = "service"
daemon = "required"
agent = "discovery_only"
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked", "admin_auth_required", "secret_not_found"]

[[command]]
path = "request http"
auth = "agent"
daemon = "required"
agent = true
outputs = ["human", "json", "toon"]
errors = ["envault_not_running", "envault_locked", "permission_denied", "request_rejected"]

[[command]]
path = "profile export"
auth = "admin"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["admin_auth_required", "package_error"]

[[command]]
path = "workspace import"
auth = "admin"
daemon = "required"
agent = false
outputs = ["human", "json", "toon"]
errors = ["admin_auth_required", "package_error", "conflict"]

